<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>给你的信</title>
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;background:#fff;position:fixed;inset:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.stage{position:relative;width:100%;height:100dvh;overflow:hidden;background:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#sky{position:absolute;inset:0;background:#050508;display:block}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.scene.on{display:flex}
.veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60}
#words{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#hearts{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.rh{position:absolute;top:-34px;left:0;pointer-events:none;will-change:transform}

/* ---- scene 0 : envelope ---- */
.sc0{background:#fff}
.env-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;width:100%}
.env-title{font-size:20px;font-weight:500;color:#1a1a1a;letter-spacing:1px}
.env-hint{font-size:13px;color:#9a958e;letter-spacing:2px}
.envelope{position:relative;width:min(300px,80vw);height:200px;background:linear-gradient(160deg,#ffffff 0%,#f6f2ec 60%,#efe9e0 100%);border:1px solid #d9d3c8;border-radius:10px;box-shadow:0 24px 48px rgba(60,45,30,.16),0 6px 16px rgba(60,45,30,.10)}
.envelope:before{content:"";position:absolute;inset:10px;border:1px dashed #cfc8bb;border-radius:6px;pointer-events:none}
.env-side{position:absolute;top:1px;bottom:1px;width:56%;z-index:1}
.env-side.l{left:1px;background:linear-gradient(100deg,#f8f4ed,#ece4d6);clip-path:polygon(0 0,0 100%,100% 62%);border-radius:0 0 0 9px}
.env-side.r{right:1px;background:linear-gradient(260deg,#f8f4ed,#ece4d6);clip-path:polygon(100% 0,100% 100%,0 62%);border-radius:0 0 9px 0}
.env-flap{position:absolute;top:0;left:0;width:100%;height:112px;z-index:2;background:linear-gradient(180deg,#f3eee6,#e7dfd1);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 4px rgba(60,45,30,.18))}
.seal{position:absolute;left:50%;top:88px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:none;z-index:3;background:radial-gradient(circle at 35% 30%,#e2606e,#c23a4a 60%,#9e2b3a);box-shadow:0 8px 18px rgba(160,40,60,.45),inset 0 2px 4px rgba(255,255,255,.35),inset 0 -3px 6px rgba(90,10,25,.4);color:#fff;display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.09)}}

/* ---- night sky scenes ---- */
.sc-dark{background:transparent}
.letterbox{position:absolute;top:9%;left:50%;transform:translateX(-50%);width:88%;max-width:340px;text-align:center;transition:opacity 1.4s ease}
.letterbox.fadeout{opacity:0}
.tline{min-height:30px;font-size:16px;color:#f2f2f2;line-height:1.9}
.caret{display:inline-block;width:2px;height:15px;background:#ff4d6d;vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fire-hint{position:absolute;top:58%;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;letter-spacing:2px;opacity:0;white-space:nowrap;text-shadow:0 0 12px rgba(255,255,255,.5)}
.fire-hint.show{animation:hintpulse 1.5s ease-in-out infinite}
@keyframes hintpulse{0%,100%{opacity:.35}50%{opacity:1}}
.figures{position:absolute;bottom:54px;left:50%;transform:translateX(-50%)}
.midwords{position:absolute;top:44%;left:50%;transform:translateX(-50%);width:88%;max-width:340px;text-align:center;color:#fff;font-size:20px;letter-spacing:1px;line-height:2.2;opacity:0;transition:opacity 1.2s ease}
.midwords.on{opacity:1}
.midwords .w{display:inline-block;margin:0 5px;color:#ffd9e0;animation:wpop .5s ease}
@keyframes wpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* fireworks words & click hearts */
.word{position:absolute;transform:translate(-50%,-50%);font-size:36px;font-weight:600;pointer-events:none;animation:wordpop 1.9s cubic-bezier(.2,.7,.3,1) forwards;text-shadow:0 0 22px currentColor,0 0 46px currentColor}
@keyframes wordpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}28%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-118%) scale(1.02)}}
.clickheart{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);color:#ff4d6d;animation:chfade 1.25s ease-out forwards;pointer-events:none}
@keyframes chfade{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}

/* ---- final scene ---- */
.sc4{gap:16px}
.bigheart{color:#ff4d6d;animation:beat 1.15s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(255,77,109,.5))}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.14)}45%{transform:scale(1.03)}60%{transform:scale(1.1)}}
.love-text{font-size:46px;color:#fff;font-weight:500;letter-spacing:12px;text-indent:12px;opacity:0;transform:scale(.92)}
.love-text.show{transition:opacity 1.6s ease,transform 1.6s ease;opacity:1;transform:scale(1)}
.btnrow{display:flex;gap:14px;margin-top:24px;opacity:0;transition:opacity .9s ease}
.btnrow.show{opacity:1}
.btn{padding:12px 22px;border-radius:999px;font-size:15px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;letter-spacing:1px}
.btn.primary{background:#ff4d6d;border-color:#ff4d6d;box-shadow:0 4px 16px rgba(255,77,109,.45)}
</style>
<div class="stage" id="stage">
  <canvas id="sky"></canvas>
  <div class="scene sc0 on" id="sc0">
    <div class="env-wrap">
      <div class="env-title">有一封信，只想给你看</div>
      <div class="envelope">
        <div class="env-side l"></div>
        <div class="env-side r"></div>
        <div class="env-flap"></div>
        <button class="seal" id="sealBtn" aria-label="拆开这封信"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
      </div>
      <div class="env-hint">点开那个心跳的火漆封印</div>
    </div>
  </div>
  <div class="scene sc-dark" id="sc1">
    <div class="letterbox" id="letter1"></div>
    <div class="fire-hint" id="fireHint">点击屏幕放烟花喽</div>
    <div class="midwords" id="midWords"><span class="w">你</span></div>
    <svg class="figures" viewBox="0 0 240 110" width="240" height="110">
      <line x1="8" y1="96" x2="232" y2="96" stroke="#ffffff" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>
      <g stroke="#ffffff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round" fill="none">
        <circle cx="82" cy="34" r="10"/>
        <path d="M82 44 C85 56 88 68 90 80"/>
        <path d="M85 52 L70 92"/>
        <path d="M90 80 L110 86"/>
        <path d="M110 86 L120 96"/>
        <circle cx="160" cy="30" r="10"/>
        <path d="M160 40 C163 52 166 64 168 76"/>
        <path d="M163 48 L148 88"/>
        <path d="M168 76 L188 82"/>
        <path d="M188 82 L198 96"/>
      </g>
      <g stroke="#c7ccd6" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M72 33 A10 10 0 0 1 92 33"/>
        <path d="M150 29 A10 10 0 0 1 170 29"/>
      </g>
      <path d="M155 41 q5.5 4.5 11 0" stroke="#ff4d6d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path transform="translate(118,2) scale(0.8)" fill="#ff4d6d" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>
  <div class="scene sc-dark" id="sc3"><div class="letterbox" style="position:static;transform:none" id="letter2"></div></div>
  <div class="scene sc-dark sc4" id="sc4">
    <div class="bigheart"><svg width="84" height="84" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <div class="love-text" id="loveText">我爱你</div>
    <div class="btnrow" id="btnRow">
      <button class="btn primary" id="loveBtn">我也爱你！</button>
      <button class="btn" id="replayBtn">我要再来一遍</button>
    </div>
  </div>
  <div id="words"></div>
  <div id="hearts"></div>
  <div class="veil" id="veil"></div>
</div>
<script>
(function(){
var stage=document.getElementById('stage'),sky=document.getElementById('sky'),ctx=sky.getContext('2d');
var veil=document.getElementById('veil'),wordsLayer=document.getElementById('words'),heartsLayer=document.getElementById('hearts');
var sc0=document.getElementById('sc0'),sc1=document.getElementById('sc1'),sc3=document.getElementById('sc3'),sc4=document.getElementById('sc4');
var letter1El=document.getElementById('letter1'),letter2El=document.getElementById('letter2');
var fireHint=document.getElementById('fireHint'),midWords=document.getElementById('midWords');
var loveText=document.getElementById('loveText'),btnRow=document.getElementById('btnRow');
var W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){var r=stage.getBoundingClientRect();W=r.width;H=r.height;sky.width=W*dpr;sky.height=H*dpr;sky.style.width=W+'px';sky.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);makeStars();}
window.addEventListener('resize',resize);resize();
var HEART='<svg viewBox="0 0 24 24" fill="currentColor" width="100%" height="100%"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
var PALETTE=['#ff4757','#ffa502','#2ed573','#1e90ff','#eccc68','#ff6b81','#7bed9f','#70a1ff','#f368e0','#48dbfb','#feca57','#ff9ff3'];
var WORDS=['温柔','阳光','体贴','真诚','纯情','恋爱脑','乖宝宝','善良','可爱','情商高','傲娇','热情'];
var HC=['#ff4d6d','#ff758f','#ff8fa3','#ffb3c1','#e63956'];
var L1=['2024年6月3日，那是个特别的日子','那天','我遇到了一位如宝石般璀璨的女朋友','起初我被你那柔风拂面的外表所倾心','而随着和你相处的日子不断变多','又被你那雨后初虹般绚烂的性格所陶醉'];
var L2=['遇见你之后，','所有平凡的日子都开始闪闪发光。','有句话很久没有对你说了','今天，我想再认真说一次——'];
var state='s0',wordIdx=0,last=performance.now();
var stars=[],meteors=[],rockets=[],parts=[],nextMeteor=0;
var hearts=[],rainOn=false,slow=false,nextRain=0;
function makeStars(){stars=[];var n=Math.max(60,Math.floor(W*H/9000));for(var i=0;i<n;i++){stars.push({x:Math.random()*W,y:Math.random()*H*0.72,r:0.3+Math.random()*1.3,ph:Math.random()*6.28,sp:0.5+Math.random()*1.6});}}
function show(el){[sc0,sc1,sc3,sc4].forEach(function(e){e.classList.remove('on');});el.classList.add('on');}
var typeTok=0;
function typeLines(el,lines,done){var my=++typeTok;el.innerHTML='';var li=0;
function nextLine(){if(my!==typeTok)return;if(li>=lines.length){done&&done();return;}
var div=document.createElement('div');div.className='tline';el.appendChild(div);
var caret=document.createElement('span');caret.className='caret';div.appendChild(caret);
var text=lines[li++],ci=0;
var tm=setInterval(function(){if(my!==typeTok){clearInterval(tm);return;}
if(ci<text.length){caret.insertAdjacentText('beforebegin',text[ci++]);}
else{clearInterval(tm);caret.remove();setTimeout(nextLine,400);}},85);}
nextLine();}
function spawnWord(x,y,color,text){var d=document.createElement('div');d.className='word';d.style.left=x+'px';d.style.top=y+'px';d.style.color=color;d.textContent=text;wordsLayer.appendChild(d);d.addEventListener('animationend',function(){d.remove();});}
function clickHeart(x,y){var d=document.createElement('div');d.className='clickheart';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=HEART;wordsLayer.appendChild(d);d.addEventListener('animationend',function(){d.remove();});}
function explode(x,y){var c=PALETTE[Math.floor(Math.random()*PALETTE.length)];
for(var k=0;k<56;k++){var a=Math.random()*6.283,sp=70+Math.random()*175;
parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.9+Math.random()*0.9,color:c,r:1.8+Math.random()*1.4});}
var w=WORDS[wordIdx];
spawnWord(x,y,c,w);
var span=document.createElement('span');span.className='w';span.textContent=w;midWords.appendChild(span);
if(wordIdx===WORDS.length-1){var dots=document.createElement('span');dots.className='w';dots.textContent='……';midWords.appendChild(dots);}
navigator.vibrate&&navigator.vibrate(30);
wordIdx++;
if(wordIdx===WORDS.length){setTimeout(goLetter2,2600);}}
function launchRocket(x){rockets.push({x:Math.max(30,Math.min(W-30,x+(Math.random()*90-45))),y:H+12,ty:H*(0.2+Math.random()*0.2),sp:H*0.85});}
function spawnHeart(y,spMin,spMax){if(hearts.length>90)return;var el=document.createElement('div');el.className='rh';var s=12+Math.random()*14;el.style.width=s+'px';el.style.height=s+'px';el.style.color=HC[Math.floor(Math.random()*HC.length)];el.innerHTML=HEART;heartsLayer.appendChild(el);hearts.push({el:el,x:Math.random()*W,y:y,sp:spMin+Math.random()*(spMax-spMin),rot:Math.random()*360,rs:Math.random()*60-30});}
function burstHearts(n){for(var i=0;i<n;i++){spawnHeart(-20-Math.random()*140,430,760);}}
function goLetter2(){if(state!=='fw')return;state='s3';show(sc3);typeLines(letter2El,L2,function(){setTimeout(goS4,2000);});}
function goS4(){state='s4';show(sc4);rainOn=true;loveText.classList.add('show');setTimeout(function(){btnRow.classList.add('show');},2000);}
document.getElementById('sealBtn').addEventListener('click',function(){
if(state!=='s0')return;navigator.vibrate&&navigator.vibrate(25);
var t0=performance.now(),D=1700;
(function fade(ts){var t=Math.min((ts-t0)/D,1);veil.style.opacity=(t*t).toFixed(3);
if(t<1){requestAnimationFrame(fade);}
else{show(sc1);state='s1';requestAnimationFrame(function(){veil.style.opacity=0;});setTimeout(function(){typeLines(letter1El,L1,function(){state='fw';fireHint.classList.add('show');midWords.classList.add('on');});},350);}})(t0);});
stage.addEventListener('click',function(e){
if(state!=='fw')return;
var r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
fireHint.classList.remove('show');letter1El.classList.add('fadeout');
if(wordIdx<WORDS.length){launchRocket(x);}else{clickHeart(x,y);}});
function setHold(v){slow=v;}
stage.addEventListener('touchstart',function(e){if(state==='s4'&&!e.target.closest('button')){setHold(true);}},{passive:true});
stage.addEventListener('touchend',function(){setHold(false);});
stage.addEventListener('touchcancel',function(){setHold(false);});
stage.addEventListener('mousedown',function(e){if(state==='s4'&&!e.target.closest('button')){setHold(true);}});
window.addEventListener('mouseup',function(){setHold(false);});
document.getElementById('loveBtn').addEventListener('click',function(){navigator.vibrate&&navigator.vibrate([50,60,50]);burstHearts(22);});
document.getElementById('replayBtn').addEventListener('click',function(){replay();});
function replay(){typeTok++;state='s0';wordIdx=0;rainOn=false;slow=false;
hearts.forEach(function(h){h.el.remove();});hearts=[];rockets=[];parts=[];meteors=[];
letter1El.innerHTML='';letter2El.innerHTML='';letter1El.classList.remove('fadeout');
midWords.innerHTML='<span class="w">你</span>';midWords.classList.remove('on');
fireHint.classList.remove('show');
loveText.classList.remove('show');btnRow.classList.remove('show');
veil.style.opacity=0;show(sc0);}
function loop(ts){requestAnimationFrame(loop);
var dt=Math.min((ts-last)/1000,0.05);last=ts;
ctx.clearRect(0,0,W,H);
var i,s;
for(i=0;i<stars.length;i++){s=stars[i];ctx.globalAlpha=0.2+0.8*Math.abs(Math.sin(ts/1000*s.sp+s.ph));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
ctx.globalAlpha=1;
if(ts>nextMeteor&&meteors.length<2){meteors.push({x:W*(0.35+Math.random()*0.65),y:Math.random()*H*0.2,vx:-(260+Math.random()*160),vy:130+Math.random()*90,life:1});nextMeteor=ts+2500+Math.random()*4000;}
for(i=meteors.length-1;i>=0;i--){var m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt*0.85;
if(m.life<=0||m.y>H+60){meteors.splice(i,1);continue;}
var tx=m.x-m.vx*0.22,ty=m.y-m.vy*0.22;
var g=ctx.createLinearGradient(m.x,m.y,tx,ty);g.addColorStop(0,'rgba(255,255,255,'+(0.9*m.life).toFixed(2)+')');g.addColorStop(1,'rgba(255,255,255,0)');
ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();
ctx.fillStyle='rgba(255,255,255,'+m.life.toFixed(2)+')';ctx.beginPath();ctx.arc(m.x,m.y,1.7,0,6.283);ctx.fill();}
for(i=rockets.length-1;i>=0;i--){var rk=rockets[i];rk.y-=rk.sp*dt;
parts.push({x:rk.x+(Math.random()*4-2),y:rk.y+10,vx:0,vy:40,life:0.5,decay:2.2,color:'#ffd27d',r:1.4});
if(rk.y<=rk.ty){explode(rk.x,rk.y);rockets.splice(i,1);}}
for(i=parts.length-1;i>=0;i--){var p=parts[i];p.vy+=110*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.decay*dt;
if(p.life<=0){parts.splice(i,1);continue;}
ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(0.5+p.life*0.8),0,6.283);ctx.fill();}
ctx.globalAlpha=1;
if(rainOn&&ts>nextRain){spawnHeart(-30,60,120);nextRain=ts+(slow?110:380);}
var f=slow?0.35:1;
for(i=hearts.length-1;i>=0;i--){var h=hearts[i];h.y+=h.sp*f*dt;h.rot+=h.rs*dt;
if(h.y>H+40){h.el.remove();hearts.splice(i,1);continue;}
h.el.style.transform='translate('+h.x.toFixed(1)+'px,'+h.y.toFixed(1)+'px) rotate('+h.rot.toFixed(0)+'deg)';}}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
